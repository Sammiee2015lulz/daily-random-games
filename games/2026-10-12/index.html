<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — 2026-10-12</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a12; color: #e0ffe0; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: #0f0f1a; border-radius: 10px; box-shadow: 0 0 40px #0f08; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">Neon Snake</div>
<div id="help">Arrows or WASD to turn. Eat orbs, avoid walls & self. R restart.</div>
<canvas id="c" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const CELL = 20;
const COLS = 20, ROWS = 20;
let best = Number(localStorage.getItem('neon-snake-best') || 0);
let snake, dir, nextDir, food, score, alive, tick;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  alive = true;
  tick = 0;
  placeFood();
}
function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (!alive) return;
  if ((k === 'arrowup' || k === 'w') && dir.y === 0) nextDir = {x: 0, y: -1};
  if ((k === 'arrowdown' || k === 's') && dir.y === 0) nextDir = {x: 0, y: 1};
  if ((k === 'arrowleft' || k === 'a') && dir.x === 0) nextDir = {x: -1, y: 0};
  if ((k === 'arrowright' || k === 'd') && dir.x === 0) nextDir = {x: 1, y: 0};
});

function update() {
  if (!alive) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score > best) { best = score; localStorage.setItem('neon-snake-best', String(best)); }
    placeFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, 400, 400);
  // grid subtle
  ctx.strokeStyle = '#1a1a2a';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(400, i*CELL); ctx.stroke();
  }
  // food
  ctx.fillStyle = '#ff4d6d';
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 15;
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
  ctx.shadowBlur = 0;
  // snake
  for (let i = 0; i < snake.length; i++) {
    const s = snake[i];
    const hue = 140 + i * 3;
    ctx.fillStyle = `hsl(${hue}, 90%, ${50 + (i === 0 ? 10 : 0)}%)`;
    if (i === 0) { ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 20; }
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    ctx.shadowBlur = 0;
  }
  hud.textContent = 'Neon Snake — score ' + score + ' — best ' + best + (alive ? '' : ' — game over, press R');
}

function loop() {
  tick++;
  if (tick % 8 === 0) update(); // speed
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
