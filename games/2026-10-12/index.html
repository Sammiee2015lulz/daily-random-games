<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane Dash — 2026-10-12</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e17; color: #e8f0ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: linear-gradient(#111828, #0b0e17); border-radius: 12px; box-shadow: 0 0 40px #0009; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">Lane Dash</div>
<div id="help">← → or A/D switch lanes. Collect orbs, dodge blocks. R restart.</div>
<canvas id="c" width="360" height="540"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const LANE_W = 120;
const LANES = 3;
let best = Number(localStorage.getItem('lane-dash-best') || 0);
let playerLane, items, score, alive, speed, spawnTimer, frame;

function reset() {
  playerLane = 1;
  items = [];
  score = 0;
  alive = true;
  speed = 2.4;
  spawnTimer = 0;
  frame = 0;
}
function spawn() {
  const lane = Math.floor(Math.random() * LANES);
  const isOrb = Math.random() < 0.35;
  items.push({
    lane,
    y: -30,
    type: isOrb ? 'orb' : 'block',
    r: isOrb ? 10 : 0,
    w: isOrb ? 0 : 36,
    h: isOrb ? 0 : 36
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (!alive) return;
  if (k === 'arrowleft' || k === 'a') playerLane = Math.max(0, playerLane - 1);
  if (k === 'arrowright' || k === 'd') playerLane = Math.min(LANES - 1, playerLane + 1);
});

function update() {
  if (!alive) return;
  frame++;
  speed = Math.min(7, 2.4 + frame * 0.0015);
  score += 0.05;
  spawnTimer++;
  if (spawnTimer > Math.max(18, 40 - frame / 80)) {
    spawn();
    spawnTimer = 0;
  }
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += speed;
    const px = playerLane * LANE_W + LANE_W / 2;
    const py = 480;
    if (it.type === 'orb') {
      if (Math.abs(it.lane - playerLane) < 0.1 && Math.abs(it.y - py) < 22) {
        score += 15;
        items.splice(i, 1);
        continue;
      }
    } else {
      if (it.lane === playerLane && it.y + 18 > py - 16 && it.y - 18 < py + 16) {
        alive = false;
      }
    }
    if (it.y > 580) items.splice(i, 1);
  }
  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('lane-dash-best', String(best));
  }
}

function draw() {
  ctx.clearRect(0, 0, 360, 540);
  // lanes
  ctx.strokeStyle = '#1e2a44';
  ctx.lineWidth = 2;
  for (let i = 1; i < LANES; i++) {
    ctx.beginPath();
    ctx.moveTo(i * LANE_W, 0);
    ctx.lineTo(i * LANE_W, 540);
    ctx.stroke();
  }
  // items
  for (const it of items) {
    const x = it.lane * LANE_W + LANE_W / 2;
    if (it.type === 'orb') {
      ctx.fillStyle = '#ffe066';
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, it.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#ff4d6d';
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = 10;
      ctx.fillRect(x - 18, it.y - 18, 36, 36);
      ctx.shadowBlur = 0;
    }
  }
  // player
  const px = playerLane * LANE_W + LANE_W / 2;
  const py = 480;
  ctx.fillStyle = alive ? '#6ee7ff' : '#666';
  ctx.shadowColor = '#6ee7ff';
  ctx.shadowBlur = alive ? 18 : 0;
  ctx.beginPath();
  ctx.arc(px, py, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  hud.textContent = 'Lane Dash — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — crashed, press R');
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
