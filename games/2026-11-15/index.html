<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size Shift — 2026-11-15</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at center, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Size Shift</div>
<div id="help">Arrows / WASD to move. Space to toggle size (small ↔ large). Small = faster, tighter hitbox. Large = slower, bigger collect range but easier to hit. Collect orbs, avoid hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('size-shift-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, large, cooldown;

function reset() {
  player = { x: W / 2, y: H / 2, r: 11, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  large = false;
  cooldown = 0;
  for (let i = 0; i < 7; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.65,
    vy: (Math.random() - 0.5) * 0.65
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 9 + Math.random() * 5,
    vx: (Math.random() - 0.5) * 1.05,
    vy: (Math.random() - 0.5) * 1.05
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'spacebar') {
    e.preventDefault();
    if (cooldown <= 0 && alive) {
      large = !large;
      player.r = large ? 18 : 9;
      cooldown = 22;
    }
  }
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.038;
  if (cooldown > 0) cooldown--;

  const accel = large ? 0.42 : 0.72;
  const friction = large ? 0.84 : 0.90;

  if (keys['arrowleft'] || keys['a']) player.vx -= accel;
  if (keys['arrowright'] || keys['d']) player.vx += accel;
  if (keys['arrowup'] || keys['w']) player.vy -= accel;
  if (keys['arrowdown'] || keys['s']) player.vy += accel;
  player.vx *= friction;
  player.vy *= friction;
  player.x += player.vx;
  player.y += player.vy;

  // walls
  if (player.x < player.r) { player.x = player.r; player.vx *= -0.45; }
  if (player.x > W - player.r) { player.x = W - player.r; player.vx *= -0.45; }
  if (player.y < player.r) { player.y = player.r; player.vy *= -0.45; }
  if (player.y > H - player.r) { player.y = H - player.r; player.vy *= -0.45; }

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 240 === 0 && hazards.length < 5) spawnHazard();

  // collect (larger size gets bonus range)
  const collectBonus = large ? 6 : 0;
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r + collectBonus) {
      score += large ? 28 : 18;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 6) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('size-shift-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? (large ? '#fbbf24' : '#60a5fa') : '#555';
  ctx.shadowColor = alive ? (large ? '#fbbf24' : '#60a5fa') : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // size toggle cooldown
  if (cooldown > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(player.x - 14, player.y - player.r - 10, 28 * (1 - cooldown / 22), 3);
  }

  const sizeName = large ? 'large' : 'small';
  hud.textContent = 'Size Shift — ' + sizeName + ' — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
