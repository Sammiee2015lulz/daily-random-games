<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue Shift — 2026-10-28</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #c8e6ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(circle at center, #152038, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Hue Shift</div>
<div id="help">WASD or ←→↑↓ to move. Space to switch color. Collect matching orbs, avoid mismatched orbs and red hazards. R restart.</div>
<canvas id="c" width="500" height="500"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 500, H = 500;
let best = Number(localStorage.getItem('hue-shift-best') || 0);
let player, orbs, hazards, score, alive, frame, colorIndex, keys = {};
const COLORS = ['#5eead4', '#fb923c']; // cyan, orange
const COLOR_NAMES = ['CYAN', 'ORANGE'];

function reset() {
  player = { x: 250, y: 250, r: 12, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  colorIndex = 0;
  for (let i = 0; i < 6; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 8,
    color: Math.floor(Math.random() * 2)
  });
}
function spawnHazard() {
  hazards.push({
    x: 30 + Math.random() * (W - 60),
    y: 30 + Math.random() * (H - 60),
    r: 9 + Math.random() * 5,
    vx: (Math.random() - 0.5) * 1.7,
    vy: (Math.random() - 0.5) * 1.7
  });
}
function switchColor() {
  if (!alive) return;
  colorIndex = 1 - colorIndex;
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
  if ((k === ' ' || k === 'space') && alive) {
    e.preventDefault();
    switchColor();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.1;

  // movement
  let mx = 0, my = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  if (mx || my) {
    const len = Math.hypot(mx, my);
    player.vx += (mx / len) * 0.55;
    player.vy += (my / len) * 0.55;
  }
  player.vx *= 0.92;
  player.vy *= 0.92;
  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(player.r + 4, Math.min(W - player.r - 4, player.x));
  player.y = Math.max(player.r + 4, Math.min(H - player.r - 4, player.y));

  // hazards
  for (const hz of hazards) {
    const dx = player.x - hz.x;
    const dy = player.y - hz.y;
    const dist = Math.hypot(dx, dy) || 1;
    hz.vx += (dx / dist) * 0.05;
    hz.vy += (dy / dist) * 0.05;
    hz.vx *= 0.98;
    hz.vy *= 0.98;
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) { hz.vx *= -0.65; hz.x = Math.max(hz.r, Math.min(W - hz.r, hz.x)); }
    if (hz.y < hz.r || hz.y > H - hz.r) { hz.vy *= -0.65; hz.y = Math.max(hz.r, Math.min(H - hz.r, hz.y)); }

    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 150 === 0 && hazards.length < 5) spawnHazard();

  // orbs: match collect, mismatch hurts
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    const dist = Math.hypot(player.x - o.x, player.y - o.y);
    if (dist < player.r + o.r) {
      if (o.color === colorIndex) {
        score += 30;
        orbs.splice(i, 1);
        spawnOrb();
      } else {
        alive = false;
      }
    }
  }
  if (orbs.length < 5) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('hue-shift-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#ff5c7a';
    ctx.shadowColor = '#ff5c7a';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = COLORS[o.color];
    ctx.shadowColor = COLORS[o.color];
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? COLORS[colorIndex] : '#666';
  ctx.shadowColor = COLORS[colorIndex];
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  hud.textContent = 'Hue Shift — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R') + ' — ' + COLOR_NAMES[colorIndex];
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
