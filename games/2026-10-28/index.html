<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Dash — 2026-10-28</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070e; color: #d0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(circle at center, #0a1428 0%, #05070e 70%); border-radius: 12px; box-shadow: 0 0 50px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Orbital Dash</div>
<div id="help">W/S or ↑↓ to change orbit. Auto-rotate around the planet. Collect cyan stars, dodge red asteroids. R restart.</div>
<canvas id="c" width="520" height="520"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 520;
const CX = W / 2, CY = H / 2;
let best = Number(localStorage.getItem('orbital-dash-best') || 0);

let player, angle, radius, asteroids, stars, score, alive, frame, keys = {};
const MIN_R = 70, MAX_R = 220;

function reset() {
  angle = 0;
  radius = 140;
  player = { r: 9 };
  asteroids = [];
  stars = [];
  score = 0;
  alive = true;
  frame = 0;
  for (let i = 0; i < 4; i++) spawnStar();
  for (let i = 0; i < 3; i++) spawnAsteroid();
}

function spawnAsteroid() {
  const a = Math.random() * Math.PI * 2;
  const startR = MAX_R + 40 + Math.random() * 60;
  asteroids.push({
    angle: a,
    radius: startR,
    speed: 0.6 + Math.random() * 0.8,
    size: 8 + Math.random() * 6
  });
}

function spawnStar() {
  const a = Math.random() * Math.PI * 2;
  const r = MIN_R + 20 + Math.random() * (MAX_R - MIN_R - 40);
  stars.push({
    angle: a,
    radius: r,
    size: 6
  });
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
});
addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

function update() {
  if (!alive) return;
  frame++;
  score += 0.08;

  // orbit control
  if (keys['arrowup'] || keys['w']) radius -= 1.4;
  if (keys['arrowdown'] || keys['s']) radius += 1.4;
  radius = Math.max(MIN_R, Math.min(MAX_R, radius));

  angle += 0.018; // auto spin

  const px = CX + Math.cos(angle) * radius;
  const py = CY + Math.sin(angle) * radius;

  // asteroids move inward
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.radius -= a.speed;
    const ax = CX + Math.cos(a.angle) * a.radius;
    const ay = CY + Math.sin(a.angle) * a.radius;

    if (a.radius < MIN_R - 20) {
      asteroids.splice(i, 1);
      continue;
    }

    if (Math.hypot(px - ax, py - ay) < player.r + a.size - 1) {
      alive = false;
    }
  }
  if (frame % 90 === 0 && asteroids.length < 7) spawnAsteroid();

  // stars
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    const sx = CX + Math.cos(s.angle) * s.radius;
    const sy = CY + Math.sin(s.angle) * s.radius;
    if (Math.hypot(px - sx, py - sy) < player.r + s.size + 2) {
      score += 25;
      stars.splice(i, 1);
      spawnStar();
    }
  }
  if (stars.length < 3) spawnStar();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('orbital-dash-best', String(best));
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // planet
  const grad = ctx.createRadialGradient(CX, CY, 20, CX, CY, 55);
  grad.addColorStop(0, '#3a6cff');
  grad.addColorStop(1, '#1a2a66');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(CX, CY, 48, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(100,160,255,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(CX, CY, 52, 0, Math.PI * 2);
  ctx.stroke();

  // orbit guide
  ctx.strokeStyle = 'rgba(80,140,220,0.15)';
  ctx.beginPath();
  ctx.arc(CX, CY, radius, 0, Math.PI * 2);
  ctx.stroke();

  const px = CX + Math.cos(angle) * radius;
  const py = CY + Math.sin(angle) * radius;

  // asteroids
  for (const a of asteroids) {
    const ax = CX + Math.cos(a.angle) * a.radius;
    const ay = CY + Math.sin(a.angle) * a.radius;
    ctx.fillStyle = '#ff4d6d';
    ctx.shadowColor = '#ff4d6d';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ax, ay, a.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // stars
  for (const s of stars) {
    const sx = CX + Math.cos(s.angle) * s.radius;
    const sy = CY + Math.sin(s.angle) * s.radius;
    ctx.fillStyle = '#5eead4';
    ctx.shadowColor = '#5eead4';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player ship
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle + Math.PI / 2);
  ctx.fillStyle = alive ? '#ffe066' : '#666';
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.moveTo(0, -player.r - 2);
  ctx.lineTo(player.r * 0.7, player.r);
  ctx.lineTo(-player.r * 0.7, player.r);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  hud.textContent = 'Orbital Dash — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — crashed, press R');
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
