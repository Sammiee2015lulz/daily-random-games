<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Shield — 2026-10-17</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e17; color: #e0f7ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(#111828, #0a0e17); border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">Orbit Shield</div>
<div id="help">← → or A/D rotate shield. Catch green, block red. R restart.</div>
<canvas id="c" width="480" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 480, H = 480, CX = 240, CY = 240;
let best = Number(localStorage.getItem('orbit-shield-best') || 0);
let angle, objects, score, alive, frame, spawnTimer;

function reset() {
  angle = 0;
  objects = [];
  score = 0;
  alive = true;
  frame = 0;
  spawnTimer = 0;
}
function spawn() {
  const type = Math.random() < 0.55 ? 'orb' : 'meteor';
  const a = Math.random() * Math.PI * 2;
  objects.push({
    type,
    angle: a,
    dist: 220,
    speed: 0.6 + Math.random() * 0.8 + frame * 0.001,
    r: type === 'orb' ? 8 : 11
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (!alive) return;
  if (k === 'arrowleft' || k === 'a') angle -= 0.08;
  if (k === 'arrowright' || k === 'd') angle += 0.08;
});

function update() {
  if (!alive) return;
  frame++;
  score += 0.05;
  spawnTimer++;
  const interval = Math.max(18, 45 - frame / 30);
  if (spawnTimer > interval) {
    spawn();
    spawnTimer = 0;
  }
  const shieldAngle = angle % (Math.PI * 2);
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    o.dist -= o.speed;
    if (o.dist < 42) {
      // check if shield covers it
      let da = Math.abs(((o.angle - shieldAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI);
      da = Math.min(da, Math.PI * 2 - da);
      const covered = da < 0.55; // shield arc ~63 degrees
      if (o.type === 'orb') {
        if (covered) {
          score += 25;
          if (Math.floor(score) > best) {
            best = Math.floor(score);
            localStorage.setItem('orbit-shield-best', String(best));
          }
        }
      } else { // meteor
        if (!covered) alive = false;
      }
      objects.splice(i, 1);
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // planet
  ctx.fillStyle = '#4dc3ff';
  ctx.shadowColor = '#4dc3ff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(CX, CY, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // shield
  if (alive) {
    ctx.strokeStyle = '#4dff88';
    ctx.lineWidth = 6;
    ctx.shadowColor = '#4dff88';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(CX, CY, 48, angle - 0.55, angle + 0.55);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // objects
  for (const o of objects) {
    const x = CX + Math.cos(o.angle) * o.dist;
    const y = CY + Math.sin(o.angle) * o.dist;
    ctx.fillStyle = o.type === 'orb' ? '#4dff88' : '#ff4d6d';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(x, y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  hud.textContent = 'Orbit Shield — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — core hit, press R');
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
