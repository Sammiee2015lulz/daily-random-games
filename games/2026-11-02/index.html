<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charge Flip — 2026-11-02</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e17; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at bottom, #1a2332, #0a0e17); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Charge Flip</div>
<div id="help">←→ or A/D to move. Space to flip charge. Collect opposite-charge orbs, avoid same-charge. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('charge-flip-best') || 0);
let player, orbs, score, alive, frame, keys = {}, charge = 1; // 1 = +, -1 = -

function reset() {
  player = { x: W / 2, y: H - 60, r: 14, vx: 0 };
  orbs = [];
  score = 0;
  alive = true;
  frame = 0;
  charge = 1;
  for (let i = 0; i < 5; i++) spawnOrb();
}
function spawnOrb() {
  orbs.push({
    x: 20 + Math.random() * (W - 40),
    y: -20 - Math.random() * 80,
    r: 9 + Math.random() * 4,
    vy: 1.4 + Math.random() * 1.8,
    charge: Math.random() < 0.5 ? 1 : -1
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
  if ((k === ' ' || k === 'space') && alive) {
    e.preventDefault();
    charge *= -1;
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.04;

  if (keys['arrowleft'] || keys['a']) player.vx -= 0.55;
  if (keys['arrowright'] || keys['d']) player.vx += 0.55;
  player.vx *= 0.85;
  player.x += player.vx;
  player.x = Math.max(player.r + 4, Math.min(W - player.r - 4, player.x));

  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.y += o.vy;
    if (o.y > H + 20) {
      orbs.splice(i, 1);
      continue;
    }
    const dx = player.x - o.x;
    const dy = player.y - o.y;
    const dist = Math.hypot(dx, dy);
    if (dist < player.r + o.r - 2) {
      if (o.charge !== charge) {
        // opposite: collect
        score += 22;
        orbs.splice(i, 1);
        spawnOrb();
      } else {
        // same: crash
        alive = false;
      }
    }
  }
  if (frame % 32 === 0 && orbs.length < 7) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('charge-flip-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = o.charge > 0 ? '#60a5fa' : '#f87171';
    ctx.shadowColor = o.charge > 0 ? '#60a5fa' : '#f87171';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // sign
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(o.charge > 0 ? '+' : '−', o.x, o.y + 4);
  }

  // player
  ctx.fillStyle = alive ? (charge > 0 ? '#3b82f6' : '#ef4444') : '#555';
  ctx.shadowColor = alive ? (charge > 0 ? '#3b82f6' : '#ef4444') : '#000';
  ctx.shadowBlur = alive ? 18 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(charge > 0 ? '+' : '−', player.x, player.y + 5);

  hud.textContent = 'Charge Flip — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — mismatched, press R') + ' — charge ' + (charge > 0 ? '+' : '−');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
