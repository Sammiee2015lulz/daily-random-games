<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Catch — 2026-11-11</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at center, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Orbit Catch</div>
<div id="help">A/D or ←→ to change orbit speed. W/S or ↑↓ to expand/shrink radius. Collect green orbs, avoid red hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
const CX = W / 2, CY = H / 2;
let best = Number(localStorage.getItem('orbit-catch-best') || 0);
let angle, radius, angVel, player, orbs, hazards, score, alive, frame, keys = {};

function reset() {
  angle = Math.random() * Math.PI * 2;
  radius = 90;
  angVel = 0.035;
  player = { r: 11 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  for (let i = 0; i < 5; i++) spawnOrb();
  for (let i = 0; i < 2; i++) spawnHazard();
}
function spawnOrb() {
  const a = Math.random() * Math.PI * 2;
  const d = 40 + Math.random() * 160;
  orbs.push({
    x: CX + Math.cos(a) * d,
    y: CY + Math.sin(a) * d,
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5
  });
}
function spawnHazard() {
  const a = Math.random() * Math.PI * 2;
  const d = 60 + Math.random() * 140;
  hazards.push({
    x: CX + Math.cos(a) * d,
    y: CY + Math.sin(a) * d,
    r: 9 + Math.random() * 4,
    vx: (Math.random() - 0.5) * 0.9,
    vy: (Math.random() - 0.5) * 0.9
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.03;

  // controls
  if (keys['arrowleft'] || keys['a']) angVel -= 0.0018;
  if (keys['arrowright'] || keys['d']) angVel += 0.0018;
  if (keys['arrowup'] || keys['w']) radius = Math.min(190, radius + 1.2);
  if (keys['arrowdown'] || keys['s']) radius = Math.max(35, radius - 1.2);
  angVel *= 0.985; // slight friction
  angle += angVel;

  // player position
  const px = CX + Math.cos(angle) * radius;
  const py = CY + Math.sin(angle) * radius;

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(px - hz.x, py - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 220 === 0 && hazards.length < 4) spawnHazard();

  // collect orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(px - o.x, py - o.y) < player.r + o.r) {
      score += 20;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 4) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('orbit-catch-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // orbit path
  ctx.strokeStyle = 'rgba(96, 165, 250, 0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(CX, CY, radius, 0, Math.PI * 2);
  ctx.stroke();

  // center
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.arc(CX, CY, 6, 0, Math.PI * 2);
  ctx.fill();

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  const px = CX + Math.cos(angle) * radius;
  const py = CY + Math.sin(angle) * radius;
  ctx.fillStyle = alive ? '#60a5fa' : '#555';
  ctx.shadowColor = alive ? '#60a5fa' : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(px, py, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  hud.textContent = 'Orbit Catch — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
