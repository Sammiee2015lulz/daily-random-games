<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Catch — 2026-11-04</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at bottom, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Pulse Catch</div>
<div id="help">WASD or ←↑→↓ to move. Space to fire expanding pulse (collects orbs, pushes hazards). R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('pulse-catch-best') || 0);
let player, orbs, hazards, pulses, score, alive, frame, keys = {}, cooldown = 0;
const COOLDOWN = 50;
const PULSE_SPEED = 4.2;
const PULSE_MAX = 140;

function reset() {
  player = { x: W / 2, y: H / 2, r: 11, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  pulses = [];
  score = 0;
  alive = true;
  frame = 0;
  cooldown = 0;
  for (let i = 0; i < 7; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 8 + Math.random() * 4,
    vx: (Math.random() - 0.5) * 1.1,
    vy: (Math.random() - 0.5) * 1.1
  });
}
function firePulse() {
  if (!alive || cooldown > 0) return;
  pulses.push({ x: player.x, y: player.y, r: 12, max: PULSE_MAX });
  cooldown = COOLDOWN;
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
  if ((k === ' ' || k === 'space') && alive) {
    e.preventDefault();
    firePulse();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.06;
  if (cooldown > 0) cooldown--;

  // player movement
  if (keys['arrowleft'] || keys['a']) player.vx -= 0.45;
  if (keys['arrowright'] || keys['d']) player.vx += 0.45;
  if (keys['arrowup'] || keys['w']) player.vy -= 0.45;
  if (keys['arrowdown'] || keys['s']) player.vy += 0.45;
  player.vx *= 0.87;
  player.vy *= 0.87;
  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(player.r + 4, Math.min(W - player.r - 4, player.x));
  player.y = Math.max(player.r + 4, Math.min(H - player.r - 4, player.y));

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 200 === 0 && hazards.length < 5) spawnHazard();

  // pulses expand and interact
  for (let p = pulses.length - 1; p >= 0; p--) {
    const pulse = pulses[p];
    pulse.r += PULSE_SPEED;
    if (pulse.r > pulse.max) {
      pulses.splice(p, 1);
      continue;
    }
    // collect orbs in ring (near the edge)
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      const dist = Math.hypot(pulse.x - o.x, pulse.y - o.y);
      if (Math.abs(dist - pulse.r) < 14) {
        score += 16;
        orbs.splice(i, 1);
        spawnOrb();
      }
    }
    // push hazards
    for (const hz of hazards) {
      const dist = Math.hypot(pulse.x - hz.x, pulse.y - hz.y);
      if (Math.abs(dist - pulse.r) < 16) {
        const dx = hz.x - pulse.x;
        const dy = hz.y - pulse.y;
        const len = Math.hypot(dx, dy) || 1;
        hz.vx += (dx / len) * 1.8;
        hz.vy += (dy / len) * 1.8;
      }
    }
  }
  if (orbs.length < 5) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('pulse-catch-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // pulses
  for (const pulse of pulses) {
    ctx.strokeStyle = `rgba(110, 231, 183, ${1 - pulse.r / pulse.max})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(pulse.x, pulse.y, pulse.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? (cooldown > 0 ? '#a78bfa' : '#ffe066') : '#555';
  ctx.shadowColor = alive ? (cooldown > 0 ? '#a78bfa' : '#ffe066') : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // cooldown bar
  if (alive) {
    ctx.fillStyle = 'rgba(200,230,255,0.25)';
    ctx.fillRect(16, H - 18, 70, 5);
    ctx.fillStyle = cooldown > 0 ? '#a78bfa' : '#6ee7b7';
    ctx.fillRect(16, H - 18, 70 * (1 - cooldown / COOLDOWN), 5);
  }

  hud.textContent = 'Pulse Catch — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
