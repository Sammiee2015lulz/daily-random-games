<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash Snatch — 2026-11-21</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at center, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Dash Snatch</div>
<div id="help">Arrows / WASD to move. Space to dash (snatch orbs along the path, brief invulnerability). Avoid red hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('dash-snatch-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, dashing, dashTimer, cooldown, dashVx, dashVy, trail;

function reset() {
  player = { x: W / 2, y: H / 2, r: 12, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  dashing = false;
  dashTimer = 0;
  cooldown = 0;
  dashVx = 0;
  dashVy = 0;
  trail = [];
  for (let i = 0; i < 8; i++) spawnOrb();
  for (let i = 0; i < 4; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 10 + Math.random() * 5,
    vx: (Math.random() - 0.5) * 0.7,
    vy: (Math.random() - 0.5) * 0.7
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'spacebar') {
    e.preventDefault();
    if (cooldown <= 0 && alive && !dashing) {
      const speed = Math.hypot(player.vx, player.vy) || 1;
      dashVx = (player.vx / speed) * 14 || 10;
      dashVy = (player.vy / speed) * 14 || 0;
      if (Math.abs(dashVx) < 1 && Math.abs(dashVy) < 1) dashVx = 12;
      dashing = true;
      dashTimer = 12;
      cooldown = 50;
      trail = [];
    }
  }
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.03;
  if (cooldown > 0) cooldown--;
  if (dashing) {
    dashTimer--;
    player.x += dashVx;
    player.y += dashVy;
    trail.push({ x: player.x, y: player.y, life: 8 });
    if (dashTimer <= 0) {
      dashing = false;
      player.vx = dashVx * 0.3;
      player.vy = dashVy * 0.3;
    }
  } else {
    if (keys['arrowleft'] || keys['a']) player.vx -= 0.5;
    if (keys['arrowright'] || keys['d']) player.vx += 0.5;
    if (keys['arrowup'] || keys['w']) player.vy -= 0.5;
    if (keys['arrowdown'] || keys['s']) player.vy += 0.5;
    player.vx *= 0.87;
    player.vy *= 0.87;
    player.x += player.vx;
    player.y += player.vy;
  }

  if (player.x < player.r) { player.x = player.r; if (!dashing) player.vx *= -0.4; }
  if (player.x > W - player.r) { player.x = W - player.r; if (!dashing) player.vx *= -0.4; }
  if (player.y < player.r) { player.y = player.r; if (!dashing) player.vy *= -0.4; }
  if (player.y > H - player.r) { player.y = H - player.r; if (!dashing) player.vy *= -0.4; }

  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (!dashing && Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 240 === 0 && hazards.length < 6) spawnHazard();

  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r + (dashing ? 8 : 0)) {
      score += dashing ? 28 : 12;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 7) spawnOrb();

  trail = trail.filter(t => { t.life--; return t.life > 0; });

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('dash-snatch-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const t of trail) {
    ctx.fillStyle = `rgba(96,165,250,${t.life / 12})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.fillStyle = alive ? (dashing ? '#a78bfa' : '#60a5fa') : '#555';
  ctx.shadowColor = alive ? (dashing ? '#a78bfa' : '#60a5fa') : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (cooldown > 0 && !dashing) {
    const t = 1 - cooldown / 50;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(player.x - 16, player.y - player.r - 10, 32 * Math.max(0, t), 3);
  }

  const state = dashing ? 'dashing' : (cooldown > 0 ? 'cooling' : 'ready');
  hud.textContent = 'Dash Snatch — ' + state + ' — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
