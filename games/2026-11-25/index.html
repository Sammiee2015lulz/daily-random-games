<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue Shift — 2026-11-25</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at center, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Hue Shift</div>
<div id="help">Arrows / WASD to move. Space to switch hue (cyan/magenta). Collect matching orbs. Avoid red hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('hue-shift-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, hue;

function reset() {
  player = { x: W / 2, y: H / 2, r: 12, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  hue = 0; // 0 cyan, 1 magenta
  for (let i = 0; i < 8; i++) spawnOrb();
  for (let i = 0; i < 4; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    hue: Math.random() < 0.5 ? 0 : 1
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 10 + Math.random() * 5,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'spacebar') {
    e.preventDefault();
    if (alive) hue = 1 - hue;
  }
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.028;

  if (keys['arrowleft'] || keys['a']) player.vx -= 0.5;
  if (keys['arrowright'] || keys['d']) player.vx += 0.5;
  if (keys['arrowup'] || keys['w']) player.vy -= 0.5;
  if (keys['arrowdown'] || keys['s']) player.vy += 0.5;
  player.vx *= 0.87;
  player.vy *= 0.87;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < player.r) { player.x = player.r; player.vx *= -0.4; }
  if (player.x > W - player.r) { player.x = W - player.r; player.vx *= -0.4; }
  if (player.y < player.r) { player.y = player.r; player.vy *= -0.4; }
  if (player.y > H - player.r) { player.y = H - player.r; player.vy *= -0.4; }

  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 240 === 0 && hazards.length < 6) spawnHazard();

  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (o.hue === hue && Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
      score += 16;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 7) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('hue-shift-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const o of orbs) {
    const color = o.hue === 0 ? '#22d3ee' : '#e879f9';
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  const pcolor = hue === 0 ? '#22d3ee' : '#e879f9';
  ctx.fillStyle = alive ? pcolor : '#555';
  ctx.shadowColor = alive ? pcolor : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  const hueName = hue === 0 ? 'cyan' : 'magenta';
  hud.textContent = 'Hue Shift — ' + hueName + ' — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
