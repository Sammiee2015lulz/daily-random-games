<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Flip — 2026-11-01</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #c8e6ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(circle at center, #152038, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Gravity Flip</div>
<div id="help">←→ or A/D to move. Space to flip gravity. Collect green orbs, avoid red hazards. R restart.</div>
<canvas id="c" width="500" height="500"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 500, H = 500;
let best = Number(localStorage.getItem('gravity-flip-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, gravity = 1; // 1 down, -1 up

function reset() {
  player = { x: 250, y: 250, r: 11, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  gravity = 1;
  for (let i = 0; i < 5; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 7
  });
}
function spawnHazard() {
  hazards.push({
    x: 30 + Math.random() * (W - 60),
    y: 30 + Math.random() * (H - 60),
    r: 9 + Math.random() * 5,
    vx: (Math.random() - 0.5) * 1.2,
    vy: 0
  });
}
function flip() {
  if (!alive) return;
  gravity *= -1;
  player.vy *= 0.3; // damp on flip for control
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
  if ((k === ' ' || k === 'space') && alive) {
    e.preventDefault();
    flip();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.08;

  // horizontal movement
  if (keys['arrowleft'] || keys['a']) player.vx -= 0.45;
  if (keys['arrowright'] || keys['d']) player.vx += 0.45;
  player.vx *= 0.88;

  // gravity
  player.vy += gravity * 0.28;
  player.vy = Math.max(-8, Math.min(8, player.vy));

  player.x += player.vx;
  player.y += player.vy;

  // walls
  if (player.x < player.r + 4) { player.x = player.r + 4; player.vx *= -0.5; }
  if (player.x > W - player.r - 4) { player.x = W - player.r - 4; player.vx *= -0.5; }
  if (player.y < player.r + 4) { player.y = player.r + 4; player.vy *= -0.6; }
  if (player.y > H - player.r - 4) { player.y = H - player.r - 4; player.vy *= -0.6; }

  // hazards (also affected by gravity, bounce)
  for (const hz of hazards) {
    hz.vy += gravity * 0.12;
    hz.vy = Math.max(-4, Math.min(4, hz.vy));
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) { hz.vy *= -0.7; hz.y = Math.max(hz.r, Math.min(H - hz.r, hz.y)); }
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 250 === 0 && hazards.length < 5) spawnHazard();

  // orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
      score += 30;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 4) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('gravity-flip-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // gravity indicator
  ctx.fillStyle = gravity > 0 ? 'rgba(255,100,100,0.15)' : 'rgba(100,150,255,0.15)';
  ctx.fillRect(0, gravity > 0 ? H - 30 : 0, W, 30);

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#ff5c7a';
    ctx.shadowColor = '#ff5c7a';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? (gravity > 0 ? '#ffe066' : '#a78bfa') : '#666';
  ctx.shadowColor = alive ? (gravity > 0 ? '#ffe066' : '#a78bfa') : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // arrow indicator for gravity
  if (alive) {
    ctx.fillStyle = '#c8e6ff';
    ctx.font = '16px system-ui';
    ctx.fillText(gravity > 0 ? '↓' : '↑', player.x - 6, player.y - 18);
  }

  hud.textContent = 'Gravity Flip — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R') + ' — ' + (gravity > 0 ? 'DOWN' : 'UP');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
