<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Flip — 2026-11-05</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at bottom, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Gravity Flip</div>
<div id="help">A/D or ←→ to move. Space to flip gravity. Collect green orbs, avoid red hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('gravity-flip-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, gravity = 1; // 1 down, -1 up
const GRAV = 0.28;
const MAX_FALL = 7.5;

function reset() {
  player = { x: W / 2, y: H / 2, r: 12, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  gravity = 1;
  for (let i = 0; i < 6; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.4
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 9 + Math.random() * 4,
    vx: (Math.random() - 0.5) * 1.4,
    vy: (Math.random() - 0.5) * 1.0
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
  if ((k === ' ' || k === 'space') && alive) {
    e.preventDefault();
    gravity *= -1;
    player.vy = 0;
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.05;

  // horizontal control
  if (keys['arrowleft'] || keys['a']) player.vx -= 0.5;
  if (keys['arrowright'] || keys['d']) player.vx += 0.5;
  player.vx *= 0.86;
  player.x += player.vx;
  player.x = Math.max(player.r + 4, Math.min(W - player.r - 4, player.x));

  // gravity
  player.vy += GRAV * gravity;
  player.vy = Math.max(-MAX_FALL, Math.min(MAX_FALL, player.vy));
  player.y += player.vy;

  // bounce off floor/ceiling
  if (player.y < player.r + 2) {
    player.y = player.r + 2;
    player.vy = Math.abs(player.vy) * 0.35;
  }
  if (player.y > H - player.r - 2) {
    player.y = H - player.r - 2;
    player.vy = -Math.abs(player.vy) * 0.35;
  }

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 220 === 0 && hazards.length < 5) spawnHazard();

  // collect orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
      score += 18;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 5) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('gravity-flip-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // gravity arrow indicator
  if (alive) {
    ctx.strokeStyle = 'rgba(200,220,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const ax = W - 28, ay = 28;
    ctx.moveTo(ax, ay - 8 * gravity);
    ctx.lineTo(ax, ay + 8 * gravity);
    ctx.moveTo(ax - 5, ay + 4 * gravity);
    ctx.lineTo(ax, ay + 10 * gravity);
    ctx.lineTo(ax + 5, ay + 4 * gravity);
    ctx.stroke();
  }

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? (gravity > 0 ? '#ffe066' : '#a78bfa') : '#555';
  ctx.shadowColor = alive ? (gravity > 0 ? '#ffe066' : '#a78bfa') : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  hud.textContent = 'Gravity Flip — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R') + ' — ' + (gravity > 0 ? 'DOWN' : 'UP');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
