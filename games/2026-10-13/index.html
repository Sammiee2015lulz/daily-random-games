<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — 2026-10-13</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e17; color: #e0f7ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: #111828; border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">Neon Snake</div>
<div id="help">Arrows / WASD to turn. Eat the glow to grow. Avoid walls and yourself. R restart.</div>
<canvas id="c" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const SIZE = 20;
const COLS = 20;
const ROWS = 20;
let best = Number(localStorage.getItem('neon-snake-best') || 0);
let snake, dir, nextDir, food, score, alive, tick;

function spawnFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  return pos;
}
function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { ...dir };
  food = spawnFood();
  score = 0;
  alive = true;
  tick = 0;
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (!alive) return;
  if ((k === 'arrowup' || k === 'w') && dir.y === 0) nextDir = { x: 0, y: -1 };
  if ((k === 'arrowdown' || k === 's') && dir.y === 0) nextDir = { x: 0, y: 1 };
  if ((k === 'arrowleft' || k === 'a') && dir.x === 0) nextDir = { x: -1, y: 0 };
  if ((k === 'arrowright' || k === 'd') && dir.x === 0) nextDir = { x: 1, y: 0 };
});

function update() {
  if (!alive) return;
  tick++;
  if (tick % 6 !== 0) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    food = spawnFood();
    if (score > best) {
      best = score;
      localStorage.setItem('neon-snake-best', String(best));
    }
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  // food
  ctx.fillStyle = '#ffeb3b';
  ctx.shadowColor = '#ffeb3b';
  ctx.shadowBlur = 15;
  ctx.fillRect(food.x * SIZE + 2, food.y * SIZE + 2, SIZE - 4, SIZE - 4);
  ctx.shadowBlur = 0;
  // snake
  for (let i = 0; i < snake.length; i++) {
    const s = snake[i];
    const hue = 190 + (i * 8) % 40;
    ctx.fillStyle = i === 0 ? '#4fc3f7' : `hsl(${hue}, 80%, ${55 - i % 10}%)`;
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = i === 0 ? 12 : 4;
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
    ctx.shadowBlur = 0;
  }
  hud.textContent = 'Neon Snake — score ' + score + ' — best ' + best + (alive ? '' : ' — crashed, press R');
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
