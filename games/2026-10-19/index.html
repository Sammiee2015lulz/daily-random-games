<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Flipper - Daily Game 2026-10-19</title>
<style>
  body { margin: 0; background: #0a0a1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; color: #0ff; }
  canvas { border: 2px solid #0ff; box-shadow: 0 0 20px #0ff; background: #111; }
  #info { position: absolute; top: 10px; left: 10px; font-size: 18px; }
  #score { position: absolute; top: 10px; right: 10px; font-size: 24px; }
</style>
</head>
<body>
<div id="info">SPACE or Click to flip gravity | Survive!</div>
<div id="score">Score: 0</div>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

let player = { x: 100, y: 300, vy: 0, gravity: 0.5, size: 20, flipped: false };
let obstacles = [];
let score = 0;
let gameOver = false;
let frame = 0;

function spawnObstacle() {
  const gap = 180;
  const topHeight = Math.random() * (canvas.height - gap - 100) + 50;
  obstacles.push({
    x: canvas.width,
    topH: topHeight,
    botY: topHeight + gap,
    w: 60,
    speed: 4 + score / 500
  });
}

function update() {
  if (gameOver) return;
  frame++;
  score += 0.1;
  scoreEl.textContent = 'Score: ' + Math.floor(score);

  // Gravity
  player.vy += player.gravity * (player.flipped ? -1 : 1);
  player.y += player.vy;
  // Bounds
  if (player.y < 0) { player.y = 0; player.vy = 0; }
  if (player.y > canvas.height - player.size) { player.y = canvas.height - player.size; player.vy = 0; }

  // Obstacles
  if (frame % 90 === 0) spawnObstacle();
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= o.speed;
    if (o.x + o.w < 0) obstacles.splice(i, 1);
    // Collision
    if (player.x < o.x + o.w && player.x + player.size > o.x &&
        (player.y < o.topH || player.y + player.size > o.botY)) {
      gameOver = true;
    }
  }
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Neon grid
  ctx.strokeStyle = 'rgba(0,255,255,0.1)';
  for (let i = 0; i < canvas.width; i += 40) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  }
  for (let i = 0; i < canvas.height; i += 40) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
  }

  // Player - neon square
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#0ff';
  ctx.fillStyle = '#0ff';
  ctx.fillRect(player.x, player.y, player.size, player.size);
  ctx.shadowBlur = 0;

  // Obstacles
  ctx.fillStyle = '#f0f';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#f0f';
  for (const o of obstacles) {
    ctx.fillRect(o.x, 0, o.w, o.topH);
    ctx.fillRect(o.x, o.botY, o.w, canvas.height - o.botY);
  }
  ctx.shadowBlur = 0;

  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = '48px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
    ctx.font = '24px Courier New';
    ctx.fillText('Score: ' + Math.floor(score) + ' | R to restart', canvas.width/2, canvas.height/2 + 50);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function flip() {
  if (!gameOver) {
    player.flipped = !player.flipped;
    player.vy = 0; // reset velocity on flip for snappiness
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  if (e.code === 'KeyR' && gameOver) location.reload();
});
canvas.addEventListener('click', flip);

loop();
</script>
</body>
</html>
