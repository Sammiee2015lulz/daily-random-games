<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Harvest — 2026-10-19</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #c8e6ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(circle at center, #152038, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">Orbit Harvest</div>
<div id="help">SPACE or Click to reverse orbit. Collect green orbs, avoid red spikes. R restart.</div>
<canvas id="c" width="500" height="500"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 500, H = 500, CX = 250, CY = 250;
let best = Number(localStorage.getItem('orbit-harvest-best') || 0);
let player, orbs, spikes, score, alive, frame, angle, radius, dir, speed;

function reset() {
  angle = 0;
  radius = 140;
  dir = 1;
  speed = 0.025;
  player = { r: 12 };
  orbs = [];
  spikes = [];
  score = 0;
  alive = true;
  frame = 0;
  for (let i = 0; i < 5; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnSpike();
}
function spawnOrb() {
  orbs.push({
    angle: Math.random() * Math.PI * 2,
    radius: 80 + Math.random() * 140,
    r: 8,
    collected: false
  });
}
function spawnSpike() {
  spikes.push({
    angle: Math.random() * Math.PI * 2,
    radius: 60 + Math.random() * 160,
    r: 10,
    angVel: (Math.random() - 0.5) * 0.01
  });
}
function getPos(ang, rad) {
  return { x: CX + Math.cos(ang) * rad, y: CY + Math.sin(ang) * rad };
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { reset(); return; }
  if (!alive) return;
  if (k === ' ' || k === 'space') {
    e.preventDefault();
    dir *= -1;
  }
});
canvas.addEventListener('click', () => {
  if (alive) dir *= -1;
});

function update() {
  if (!alive) return;
  frame++;
  score += 0.08;
  angle += speed * dir;
  speed = 0.025 + frame * 0.000015;
  radius = 140 + Math.sin(frame * 0.01) * 10; // slight breathing

  const pPos = getPos(angle, radius);

  // orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    const oPos = getPos(o.angle, o.radius);
    if (Math.hypot(pPos.x - oPos.x, pPos.y - oPos.y) < player.r + o.r) {
      score += 15;
      orbs.splice(i, 1);
      spawnOrb();
      if (Math.floor(score) > best) {
        best = Math.floor(score);
        localStorage.setItem('orbit-harvest-best', String(best));
      }
    }
  }
  // spikes
  for (const s of spikes) {
    s.angle += s.angVel;
    const sPos = getPos(s.angle, s.radius);
    if (Math.hypot(pPos.x - sPos.x, pPos.y - sPos.y) < player.r + s.r) {
      alive = false;
    }
  }
  // keep counts
  if (orbs.length < 4) spawnOrb();
  if (spikes.length < 4 && frame % 120 === 0) spawnSpike();
  if (spikes.length > 6) spikes.shift();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  // core
  ctx.fillStyle = '#4dc3ff';
  ctx.shadowColor = '#4dc3ff';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(CX, CY, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // orbit path hint
  ctx.strokeStyle = 'rgba(77,195,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(CX, CY, radius, 0, Math.PI * 2);
  ctx.stroke();

  // orbs
  for (const o of orbs) {
    const p = getPos(o.angle, o.radius);
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  // spikes
  for (const s of spikes) {
    const p = getPos(s.angle, s.radius);
    ctx.fillStyle = '#ff5c7a';
    ctx.shadowColor = '#ff5c7a';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, s.r, 0, Math.PI * 2);
    ctx.fill();
    // spike lines
    ctx.strokeStyle = '#ff5c7a';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = s.angle + i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(a) * (s.r + 6), p.y + Math.sin(a) * (s.r + 6));
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  // player
  const pPos = getPos(angle, radius);
  ctx.fillStyle = alive ? '#ffe066' : '#666';
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(pPos.x, pPos.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  hud.textContent = 'Orbit Harvest — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
