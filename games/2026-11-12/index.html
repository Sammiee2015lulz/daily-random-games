<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendulum Catch — 2026-11-12</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at top, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Pendulum Catch</div>
<div id="help">A/D or ←→ to slide the pivot. Space to shorten the rope briefly. Collect green orbs, avoid red hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('pendulum-catch-best') || 0);
let pivot, angle, angVel, length, baseLength, player, orbs, hazards, score, alive, frame, keys = {}, cooldown;

function reset() {
  pivot = { x: W / 2, y: 40 };
  angle = (Math.random() - 0.5) * 0.8; // 0 = straight down
  angVel = 0;
  baseLength = 180;
  length = baseLength;
  player = { r: 11 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  cooldown = 0;
  for (let i = 0; i < 6; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 50 + Math.random() * (W - 100),
    y: 100 + Math.random() * (H - 160),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5
  });
}
function spawnHazard() {
  hazards.push({
    x: 40 + Math.random() * (W - 80),
    y: 120 + Math.random() * (H - 180),
    r: 9 + Math.random() * 4,
    vx: (Math.random() - 0.5) * 0.9,
    vy: (Math.random() - 0.5) * 0.9
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'spacebar') {
    e.preventDefault();
    if (cooldown <= 0 && alive) {
      length = baseLength * 0.55;
      cooldown = 40;
    }
  }
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.04;
  if (cooldown > 0) {
    cooldown--;
    if (cooldown <= 0) length = baseLength;
  }

  // move pivot
  if (keys['arrowleft'] || keys['a']) pivot.x -= 3.2;
  if (keys['arrowright'] || keys['d']) pivot.x += 3.2;
  pivot.x = Math.max(40, Math.min(W - 40, pivot.x));

  // pendulum physics (angle 0 = down)
  const g = 0.22;
  angVel += (-g / length) * Math.sin(angle);
  angVel *= 0.996;
  angle += angVel;
  // soft limits so it doesn't loop over the top
  if (angle < -1.4) { angle = -1.4; angVel *= 0.5; }
  if (angle > 1.4) { angle = 1.4; angVel *= 0.5; }

  const px = pivot.x + Math.sin(angle) * length;
  const py = pivot.y + Math.cos(angle) * length;
  player.x = px;
  player.y = py;

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < 80 || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < 90 || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 280 === 0 && hazards.length < 5) spawnHazard();

  // collect
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
      score += 22;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 5) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('pendulum-catch-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // rope
  if (alive) {
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pivot.x, pivot.y);
    ctx.lineTo(player.x, player.y);
    ctx.stroke();
  }

  // pivot
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath();
  ctx.arc(pivot.x, pivot.y, 6, 0, Math.PI * 2);
  ctx.fill();

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? (cooldown > 0 ? '#fbbf24' : '#60a5fa') : '#555';
  ctx.shadowColor = alive ? (cooldown > 0 ? '#fbbf24' : '#60a5fa') : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // cooldown bar
  if (cooldown > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(player.x - 12, player.y - 22, 24 * (1 - cooldown / 40), 3);
  }

  hud.textContent = 'Pendulum Catch — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
