<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steer Bounce — 2026-11-08</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at bottom, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Steer Bounce</div>
<div id="help">A/D or ←→ to turn. Constant speed, bounce off walls. Collect orbs, avoid hazards. Speed rises over time. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('steer-bounce-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, angle, speed;
const BASE_SPEED = 3.2;
const TURN = 0.055;

function reset() {
  player = { x: W / 2, y: H / 2, r: 11 };
  angle = Math.random() * Math.PI * 2;
  speed = BASE_SPEED;
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  for (let i = 0; i < 7; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 9 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 1.0,
    vy: (Math.random() - 0.5) * 1.0
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.04;
  speed = BASE_SPEED + Math.min(2.8, frame * 0.004);

  // turn
  if (keys['arrowleft'] || keys['a']) angle -= TURN;
  if (keys['arrowright'] || keys['d']) angle += TURN;

  // constant velocity in facing direction
  player.x += Math.cos(angle) * speed;
  player.y += Math.sin(angle) * speed;

  // bounce off walls (reflect angle)
  if (player.x < player.r + 2) {
    player.x = player.r + 2;
    angle = Math.PI - angle;
  }
  if (player.x > W - player.r - 2) {
    player.x = W - player.r - 2;
    angle = Math.PI - angle;
  }
  if (player.y < player.r + 2) {
    player.y = player.r + 2;
    angle = -angle;
  }
  if (player.y > H - player.r - 2) {
    player.y = H - player.r - 2;
    angle = -angle;
  }

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 240 === 0 && hazards.length < 5) spawnHazard();

  // collect orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
      score += 18;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 5) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('steer-bounce-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // direction indicator
  if (alive) {
    ctx.strokeStyle = 'rgba(255,224,102,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + Math.cos(angle) * 22, player.y + Math.sin(angle) * 22);
    ctx.stroke();
  }

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? '#ffe066' : '#555';
  ctx.shadowColor = alive ? '#ffe066' : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  hud.textContent = 'Steer Bounce — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
