<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Walker — 2026-10-25</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #c8e6ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(circle at center, #152038, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">Phase Walker</div>
<div id="help">WASD or ←→↑↓ to move. Hold Space to phase (pass through hazards, cannot collect). Collect green orbs while solid. R restart.</div>
<canvas id="c" width="500" height="500"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 500, H = 500;
let best = Number(localStorage.getItem('phase-walker-best') || 0);
let player, orbs, hazards, score, alive, frame, phasing, keys = {};

function reset() {
  player = { x: 250, y: 250, r: 12, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  phasing = false;
  for (let i = 0; i < 5; i++) spawnOrb();
  for (let i = 0; i < 4; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 8
  });
}
function spawnHazard() {
  hazards.push({
    x: 30 + Math.random() * (W - 60),
    y: 30 + Math.random() * (H - 60),
    r: 10 + Math.random() * 6,
    vx: (Math.random() - 0.5) * 1.8,
    vy: (Math.random() - 0.5) * 1.8
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
  if ((k === ' ' || k === 'space') && alive) {
    e.preventDefault();
    phasing = true;
  }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === ' ' || k === 'space') phasing = false;
});

function update() {
  if (!alive) return;
  frame++;
  score += phasing ? 0.04 : 0.12;

  // movement
  let mx = 0, my = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  if (mx || my) {
    const len = Math.hypot(mx, my);
    const speed = phasing ? 0.4 : 0.55;
    player.vx += (mx / len) * speed;
    player.vy += (my / len) * speed;
  }
  player.vx *= 0.91;
  player.vy *= 0.91;
  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));

  // hazards
  for (const hz of hazards) {
    // mild chase when solid, drift when phasing
    const dx = player.x - hz.x;
    const dy = player.y - hz.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (!phasing) {
      hz.vx += (dx / dist) * 0.08;
      hz.vy += (dy / dist) * 0.08;
    }
    hz.vx *= 0.985;
    hz.vy *= 0.985;
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) { hz.vx *= -0.7; hz.x = Math.max(hz.r, Math.min(W - hz.r, hz.x)); }
    if (hz.y < hz.r || hz.y > H - hz.r) { hz.vy *= -0.7; hz.y = Math.max(hz.r, Math.min(H - hz.r, hz.y)); }

    if (!phasing && Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 140 === 0 && hazards.length < 6) spawnHazard();

  // orbs only when solid
  if (!phasing) {
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
        score += 25;
        orbs.splice(i, 1);
        spawnOrb();
      }
    }
  }
  if (orbs.length < 4) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('phase-walker-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // phase aura
  if (phasing && alive) {
    ctx.fillStyle = 'rgba(160,120,255,0.12)';
    ctx.beginPath();
    ctx.arc(player.x, player.y, 50, 0, Math.PI * 2);
    ctx.fill();
  }

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = phasing ? 'rgba(255,92,122,0.45)' : '#ff5c7a';
    ctx.shadowColor = '#ff5c7a';
    ctx.shadowBlur = phasing ? 4 : 10;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = phasing ? 'rgba(110,231,183,0.4)' : '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = phasing ? 4 : 12;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? (phasing ? 'rgba(160,120,255,0.7)' : '#c4b5fd') : '#666';
  ctx.shadowColor = alive ? (phasing ? '#a078ff' : '#c4b5fd') : '#000';
  ctx.shadowBlur = alive ? (phasing ? 20 : 14) : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  if (phasing && alive) {
    ctx.strokeStyle = 'rgba(160,120,255,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  hud.textContent = 'Phase Walker — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R') + (phasing ? ' — PHASING' : ' — SOLID');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
