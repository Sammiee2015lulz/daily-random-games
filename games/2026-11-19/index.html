<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Harvest — 2026-11-19</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at center, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Pulse Harvest</div>
<div id="help">Arrows / WASD to move. Space to emit a collecting pulse. Collect green orbs with the wave. Avoid red hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('pulse-harvest-best') || 0);
let player, orbs, hazards, pulses, score, alive, frame, keys = {}, cooldown;

function reset() {
  player = { x: W / 2, y: H / 2, r: 11, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  pulses = [];
  score = 0;
  alive = true;
  frame = 0;
  cooldown = 0;
  for (let i = 0; i < 8; i++) spawnOrb();
  for (let i = 0; i < 3; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 10 + Math.random() * 5,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'spacebar') {
    e.preventDefault();
    if (cooldown <= 0 && alive) {
      pulses.push({ x: player.x, y: player.y, r: 8, maxR: 110, life: 0 });
      cooldown = 45;
    }
  }
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.03;
  if (cooldown > 0) cooldown--;

  if (keys['arrowleft'] || keys['a']) player.vx -= 0.5;
  if (keys['arrowright'] || keys['d']) player.vx += 0.5;
  if (keys['arrowup'] || keys['w']) player.vy -= 0.5;
  if (keys['arrowdown'] || keys['s']) player.vy += 0.5;
  player.vx *= 0.88;
  player.vy *= 0.88;
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < player.r) { player.x = player.r; player.vx *= -0.4; }
  if (player.x > W - player.r) { player.x = W - player.r; player.vx *= -0.4; }
  if (player.y < player.r) { player.y = player.r; player.vy *= -0.4; }
  if (player.y > H - player.r) { player.y = H - player.r; player.vy *= -0.4; }

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards drift and hurt on contact
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    hz.vx *= 0.995;
    hz.vy *= 0.995;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 280 === 0 && hazards.length < 5) spawnHazard();

  // pulses expand and collect
  for (let pi = pulses.length - 1; pi >= 0; pi--) {
    const p = pulses[pi];
    p.life++;
    p.r += 3.2;
    if (p.r >= p.maxR) {
      pulses.splice(pi, 1);
      continue;
    }
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      const dist = Math.hypot(p.x - o.x, p.y - o.y);
      if (Math.abs(dist - p.r) < o.r + 6) {
        score += 18;
        orbs.splice(i, 1);
        spawnOrb();
      }
    }
    // pulse lightly pushes hazards away
    for (const hz of hazards) {
      const dist = Math.hypot(p.x - hz.x, p.y - hz.y);
      if (Math.abs(dist - p.r) < hz.r + 8) {
        const dx = hz.x - p.x;
        const dy = hz.y - p.y;
        const d = dist || 1;
        hz.vx += (dx / d) * 1.8;
        hz.vy += (dy / d) * 1.8;
      }
    }
  }
  if (orbs.length < 6) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('pulse-harvest-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // pulses
  for (const p of pulses) {
    const alpha = 1 - p.r / p.maxR;
    ctx.strokeStyle = `rgba(110, 231, 183, ${alpha * 0.9})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(167, 243, 208, ${alpha * 0.4})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r - 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  // hazards
  for (const hz of hazards) {
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = '#6ee7b7';
    ctx.shadowColor = '#6ee7b7';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? '#60a5fa' : '#555';
  ctx.shadowColor = alive ? '#60a5fa' : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
  ctx.shadowBlur = 0;

  // cooldown bar
  if (cooldown > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(player.x - 16, player.y - player.r - 10, 32 * (1 - cooldown / 45), 3);
  }

  hud.textContent = 'Pulse Harvest — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
