<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Flip — 2026-11-14</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at center, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Phase Flip</div>
<div id="help">Arrows / WASD to move. Space to flip phase (blue ↔ green). Collect same-phase orbs, avoid same-phase hazards. Opposite phase items pass through harmlessly. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('phase-flip-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, phase, cooldown;

function reset() {
  player = { x: W / 2, y: H / 2, r: 12, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  phase = 0; // 0 = blue, 1 = green
  cooldown = 0;
  for (let i = 0; i < 7; i++) spawnOrb();
  for (let i = 0; i < 4; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 6 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 0.7,
    vy: (Math.random() - 0.5) * 0.7,
    ph: Math.random() < 0.5 ? 0 : 1
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 9 + Math.random() * 5,
    vx: (Math.random() - 0.5) * 1.1,
    vy: (Math.random() - 0.5) * 1.1,
    ph: Math.random() < 0.5 ? 0 : 1
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || k === 'spacebar') {
    e.preventDefault();
    if (cooldown <= 0 && alive) {
      phase = 1 - phase;
      cooldown = 18;
    }
  }
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.04;
  if (cooldown > 0) cooldown--;

  // movement
  if (keys['arrowleft'] || keys['a']) player.vx -= 0.6;
  if (keys['arrowright'] || keys['d']) player.vx += 0.6;
  if (keys['arrowup'] || keys['w']) player.vy -= 0.6;
  if (keys['arrowdown'] || keys['s']) player.vy += 0.6;
  player.vx *= 0.88;
  player.vy *= 0.88;
  player.x += player.vx;
  player.y += player.vy;

  // walls
  if (player.x < player.r) { player.x = player.r; player.vx *= -0.5; }
  if (player.x > W - player.r) { player.x = W - player.r; player.vx *= -0.5; }
  if (player.y < player.r) { player.y = player.r; player.vy *= -0.5; }
  if (player.y > H - player.r) { player.y = H - player.r; player.vy *= -0.5; }

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (hz.ph === phase && Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 260 === 0 && hazards.length < 6) spawnHazard();

  // collect same-phase orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (o.ph === phase && Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
      score += 24;
      orbs.splice(i, 1);
      spawnOrb();
    }
  }
  if (orbs.length < 6) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('phase-flip-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // phase tint overlay subtle
  ctx.fillStyle = phase === 0 ? 'rgba(96,165,250,0.04)' : 'rgba(52,211,153,0.04)';
  ctx.fillRect(0, 0, W, H);

  // hazards (faded if opposite phase)
  for (const hz of hazards) {
    const matching = hz.ph === phase;
    ctx.globalAlpha = matching ? 1 : 0.28;
    ctx.fillStyle = '#f87171';
    ctx.shadowColor = matching ? '#f87171' : 'transparent';
    ctx.shadowBlur = matching ? 8 : 0;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // orbs (colored by phase, faded if opposite)
  for (const o of orbs) {
    const matching = o.ph === phase;
    ctx.globalAlpha = matching ? 1 : 0.35;
    ctx.fillStyle = o.ph === 0 ? '#60a5fa' : '#34d399';
    ctx.shadowColor = matching ? (o.ph === 0 ? '#60a5fa' : '#34d399') : 'transparent';
    ctx.shadowBlur = matching ? 10 : 0;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // player
  ctx.fillStyle = alive ? (phase === 0 ? '#60a5fa' : '#34d399') : '#555';
  ctx.shadowColor = alive ? (phase === 0 ? '#60a5fa' : '#34d399') : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // cooldown indicator
  if (cooldown > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(player.x - 14, player.y - 24, 28 * (1 - cooldown / 18), 3);
  }

  const phaseName = phase === 0 ? 'blue' : 'green';
  hud.textContent = 'Phase Flip — ' + phaseName + ' phase — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
