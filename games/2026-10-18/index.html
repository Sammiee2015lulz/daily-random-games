<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaft Dive — 2026-10-18</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #c8e6ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: linear-gradient(#0d1524, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000a; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; }
</style>
</head>
<body>
<div id="hud">Shaft Dive</div>
<div id="help">← → or A/D move. Avoid rising obstacles. Survive as long as you can. R restart.</div>
<canvas id="c" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 400, H = 600;
let best = Number(localStorage.getItem('shaft-dive-best') || 0);
let player, obstacles, score, alive, frame, speed, keys = {};

function reset() {
  player = { x: W / 2, y: H - 80, r: 12 };
  obstacles = [];
  score = 0;
  alive = true;
  frame = 0;
  speed = 2.2;
  for (let i = 0; i < 5; i++) spawnObstacle(true);
}
function spawnObstacle(initial = false) {
  const w = 40 + Math.random() * 60;
  obstacles.push({
    x: Math.random() * (W - w),
    y: initial ? Math.random() * H * 0.7 : -30 - Math.random() * 80,
    w,
    h: 18 + Math.random() * 22,
    vy: speed + Math.random() * 1.2
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.15;
  speed = 2.2 + frame * 0.004;
  if (keys['arrowleft'] || keys['a']) player.x -= 5.5;
  if (keys['arrowright'] || keys['d']) player.x += 5.5;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += o.vy;
    o.vy = Math.min(o.vy + 0.01, speed + 2);
    if (o.y > H + 20) obstacles.splice(i, 1);
    if (player.x + player.r > o.x && player.x - player.r < o.x + o.w &&
        player.y + player.r > o.y && player.y - player.r < o.y + o.h) {
      alive = false;
    }
  }
  if (Math.random() < 0.035 + frame * 0.00002) spawnObstacle();
  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('shaft-dive-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  // subtle vertical lines
  ctx.strokeStyle = 'rgba(100,160,255,0.06)';
  ctx.lineWidth = 1;
  for (let x = 40; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  // obstacles
  for (const o of obstacles) {
    ctx.fillStyle = '#ff5c7a';
    ctx.shadowColor = '#ff5c7a';
    ctx.shadowBlur = 10;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.shadowBlur = 0;
  }
  // player
  ctx.fillStyle = alive ? '#6ee7ff' : '#555';
  ctx.shadowColor = alive ? '#6ee7ff' : 'transparent';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  hud.textContent = 'Shaft Dive — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — crashed, press R');
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
