<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue Shift — 2026-11-06</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b12; color: #e0e8ff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { background: radial-gradient(ellipse at bottom, #1a2332, #070b12); border-radius: 12px; box-shadow: 0 0 40px #000c; max-width: 96vw; max-height: 80vh; }
  #hud { position: fixed; top: 12px; left: 16px; font-size: 14px; }
  #help { position: fixed; bottom: 12px; left: 16px; opacity: .75; font-size: 13px; max-width: 90vw; }
</style>
</head>
<body>
<div id="hud">Hue Shift</div>
<div id="help">WASD or ←↑→↓ to move. Space to cycle hue. Collect matching color orbs, avoid black hazards. R restart.</div>
<canvas id="c" width="520" height="480"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = 520, H = 480;
let best = Number(localStorage.getItem('hue-shift-best') || 0);
let player, orbs, hazards, score, alive, frame, keys = {}, hue = 0;
const hues = ['#f87171', '#6ee7b7', '#60a5fa']; // red, green, blue
const hueNames = ['RED', 'GREEN', 'BLUE'];

function reset() {
  player = { x: W / 2, y: H / 2, r: 12, vx: 0, vy: 0 };
  orbs = [];
  hazards = [];
  score = 0;
  alive = true;
  frame = 0;
  hue = 0;
  for (let i = 0; i < 8; i++) spawnOrb();
  for (let i = 0; i < 4; i++) spawnHazard();
}
function spawnOrb() {
  orbs.push({
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    r: 7,
    vx: (Math.random() - 0.5) * 0.7,
    vy: (Math.random() - 0.5) * 0.7,
    color: Math.floor(Math.random() * 3)
  });
}
function spawnHazard() {
  hazards.push({
    x: 50 + Math.random() * (W - 100),
    y: 50 + Math.random() * (H - 100),
    r: 9 + Math.random() * 3,
    vx: (Math.random() - 0.5) * 1.2,
    vy: (Math.random() - 0.5) * 1.2
  });
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'r') reset();
  if ((k === ' ' || k === 'space') && alive) {
    e.preventDefault();
    hue = (hue + 1) % 3;
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function update() {
  if (!alive) return;
  frame++;
  score += 0.04;

  // player movement
  if (keys['arrowleft'] || keys['a']) player.vx -= 0.45;
  if (keys['arrowright'] || keys['d']) player.vx += 0.45;
  if (keys['arrowup'] || keys['w']) player.vy -= 0.45;
  if (keys['arrowdown'] || keys['s']) player.vy += 0.45;
  player.vx *= 0.87;
  player.vy *= 0.87;
  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(player.r + 4, Math.min(W - player.r - 4, player.x));
  player.y = Math.max(player.r + 4, Math.min(H - player.r - 4, player.y));

  // orbs drift
  for (const o of orbs) {
    o.x += o.vx;
    o.y += o.vy;
    if (o.x < o.r || o.x > W - o.r) o.vx *= -1;
    if (o.y < o.r || o.y > H - o.r) o.vy *= -1;
  }

  // hazards
  for (const hz of hazards) {
    hz.x += hz.vx;
    hz.y += hz.vy;
    if (hz.x < hz.r || hz.x > W - hz.r) hz.vx *= -1;
    if (hz.y < hz.r || hz.y > H - hz.r) hz.vy *= -1;
    if (Math.hypot(player.x - hz.x, player.y - hz.y) < player.r + hz.r - 1) {
      alive = false;
    }
  }
  if (frame % 250 === 0 && hazards.length < 6) spawnHazard();

  // collect matching orbs
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + o.r) {
      if (o.color === hue) {
        score += 22;
        orbs.splice(i, 1);
        spawnOrb();
      } else {
        alive = false; // wrong color kills
      }
    }
  }
  if (orbs.length < 6) spawnOrb();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem('hue-shift-best', String(best));
  }
}
function draw() {
  ctx.clearRect(0, 0, W, H);

  // hazards (black with red outline)
  for (const hz of hazards) {
    ctx.fillStyle = '#1a1a1a';
    ctx.strokeStyle = '#f87171';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // orbs
  for (const o of orbs) {
    ctx.fillStyle = hues[o.color];
    ctx.shadowColor = hues[o.color];
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // player
  ctx.fillStyle = alive ? hues[hue] : '#555';
  ctx.shadowColor = alive ? hues[hue] : '#000';
  ctx.shadowBlur = alive ? 16 : 0;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // current hue label near player
  if (alive) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(hueNames[hue][0], player.x, player.y + 4);
  }

  hud.textContent = 'Hue Shift — score ' + Math.floor(score) + ' — best ' + best + (alive ? '' : ' — hit, press R') + ' — ' + hueNames[hue];
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
